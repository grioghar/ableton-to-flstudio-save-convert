name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PyFLP for the round-trip test (PyFLP only works on Python <= 3.10)
        if: matrix.python == '3.8' || matrix.python == '3.10'
        run: pip install pyflp
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the CLI
        run: python -m als2flp --version
